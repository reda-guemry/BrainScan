[project]
name = "brainscan"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "reda-guemry", email = "guemryreda@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "graphviz>=0.21",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.6",
    "pydot>=4.0.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "tensorflow>=2.22.0rc0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "src"
module-root = ""

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
]
